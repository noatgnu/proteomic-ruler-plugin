# Slivka service configuration for proteomic-ruler
# Generated from Cauldron plugin format
#
# For file inputs that reference large databases (e.g., FASTA databases),
# consider configuring them as environment variables pointing to shared storage:
#   env:
#     DATABASE_PATH: "${SLIVKA_HOME}/databases/uniref90.fasta"
# Then reference in args as: arg: "--db=${DATABASE_PATH}"

slivka-version: "0.8"
name: proteomic-ruler
description: Estimate protein copy numbers and concentrations from deep profile mass spectrometry experiments using the Proteomic Ruler algorithm. Calculates copy numbers per cell, concentrations (nM), mass fractions, and mole fractions without spike-in standards. Based on: Wiśniewski et al. (2014) Mol Cell Proteomics 13:3497-3506. Implementation: https://github.com/noatgnu/proteomicRuler
author: Toan Phung
version: "0.1.0"
license: MIT
classifiers:
  - "Topic :: Scientific/Engineering :: Bio-Informatics"

parameters:
  input_file:
    name: "Input Protein Intensities File"
    description: "Tab-separated or CSV file containing protein intensities and UniProt accession IDs"
    type: file
    required: true
    media-type: text/csv
  accession_id_col:
    name: "Accession ID Column Name"
    description: "Column name containing UniProt accession IDs (e.g., Protein.Ids, Majority protein IDs)"
    type: text
    required: true
    default: Protein.Ids
  mw_column:
    name: "Molecular Weight Column Name"
    description: "Column name containing molecular weight in kDa or Da (leave empty to fetch from UniProt)"
    type: text
  intensity_columns:
    name: "Intensity Columns"
    description: "Select intensity columns for samples. If empty, auto-detects columns matching 'Intensity*' pattern"
    type: text
  ploidy:
    name: "Ploidy Number"
    description: "Ploidy of the organism (1=haploid, 2=diploid, 3=triploid, etc.)"
    type: float
    required: true
    default: 2
    min: 1
    max: 8
  total_cellular:
    name: "Total Cellular Protein Concentration (pg/pL)"
    description: "Total cellular protein concentration in picograms per picoliter (typical: 200 pg/pL)"
    type: float
    required: true
    default: 200
    min: 50
    max: 500
  get_mw:
    name: "Fetch Molecular Weight from UniProt"
    description: "Automatically fetch molecular weights from UniProt if not present in input file (requires internet connection)"
    type: boolean
    default: false

command:
  - python
  - ruler.py

args:
  input_file:
    arg: "--input=$(value)"
    symlink: "input_file"
  accession_id_col:
    arg: "--accession-id-col=$(value)"
  mw_column:
    arg: "--mw-column=$(value)"
  intensity_columns:
    arg: "--intensity-columns=$(value)"
  ploidy:
    arg: "--ploidy=$(value)"
  total_cellular:
    arg: "--total-cellular=$(value)"
  get_mw:
    arg: "--get-mw"
    condition: "$(value)"

outputs:
  ruler_output:
    path: "ruler_output.txt"
    media-type: text/plain

execution:
  runners:
    default:
      type: SlivkaQueueRunner

tests:
